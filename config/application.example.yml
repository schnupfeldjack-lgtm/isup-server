# 复制为 application.yml 放在本目录，或通过环境变量覆盖（勿提交真实密钥到 Git）
#
# 常用环境变量：
#   ISUP_API_KEY          ERP 请求头 X-API-Key
#   ISUP_PUBLIC_IP        设备回连公网 IP
#   ISUP_DB_PASSWORD      MySQL 密码（出库录像功能）
#   ISUP_OSS_ACCESS_KEY_ID / ISUP_OSS_ACCESS_KEY_SECRET

isup:
  public-ip: ${ISUP_PUBLIC_IP:}
  ehome-key: ${ISUP_EHOME_KEY:}
  api-key: ${ISUP_API_KEY:}
  # HLS 签名地址有效期，限制范围 60~86400 秒
  media-url-ttl-seconds: ${ISUP_MEDIA_URL_TTL_SECONDS:7200}
  # 自动同步固定停用，true 也不能恢复扫表/下载/OSS 上传。
  waybill-video:
    enabled: false
  session:
    max-active-sessions: 8
    max-playback-per-device: 2
  ffmpeg:
    # 留空保持原 HLS 编码策略；H.265 浏览器不兼容时可仅回放转 H.264：
    # playback-codec-args: -c:v libx264 -preset ultrafast -tune zerolatency -g 50 -an
    playback-codec-args: ""
  stream:
    # 回放与录像下载共用；云安全组和系统防火墙需放行 TCP 8661
    playback-port: ${ISUP_PLAYBACK_PORT:8661}
  oss:
    endpoint: ${ISUP_OSS_ENDPOINT:}
    static-domain: ${ISUP_OSS_STATIC_DOMAIN:}
    bucket: ${ISUP_OSS_BUCKET:}
    access-key-id: ${ISUP_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ISUP_OSS_ACCESS_KEY_SECRET:}

spring:
  datasource:
    url: ${ISUP_DB_URL:jdbc:mysql://127.0.0.1:3306/your_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${ISUP_DB_USERNAME:}
    password: ${ISUP_DB_PASSWORD:}
