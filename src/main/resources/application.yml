# ============================================================
# 公共配置（与部署环境无关）
#
# 环境相关的配置分成两套 profile：
#   application-dev.yml   开发 / 本机调试（默认）
#   application-prod.yml  Linux 生产
# 切换方式：打 -P prod 的包（带 Linux SDK），启动时由 start.sh 传 --spring.profiles.active=prod
# ============================================================

server:
  port: 8080

spring:
  application:
    name: isup-server

  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null

  # 数据源整套配置见 application-dev.yml / application-prod.yml

isup:
  # HLS 播放地址的签名有效期；签名密钥由 isup.api-key 单向派生
  media-url-ttl-seconds: ${ISUP_MEDIA_URL_TTL_SECONDS:7200}

logging:
  level:
    root: INFO
    com.hiki.isup: INFO
